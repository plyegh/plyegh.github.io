<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fp</title>
<style>
  body{font:28px/1.5 monospace;padding:24px;color:#000;background:#fff;}
  h1{font-size:40px;} .k{color:#06c;} pre{white-space:pre-wrap;word-break:break-all;}
</style></head>
<body>
<h1>CHROME FINGERPRINT</h1>
<pre id="out">collecting...</pre>
<script>
function line(k,v){return k.padEnd(16)+': '+v;}
var L=[];
try{ L.push(line('userAgent', navigator.userAgent)); }catch(e){L.push('ua err '+e);}
try{ L.push(line('uaData', JSON.stringify(navigator.userAgentData||null))); }catch(e){}
try{ L.push(line('appVersion', navigator.appVersion)); }catch(e){}
try{ L.push(line('platform', navigator.platform)); }catch(e){}
try{ L.push(line('vendor', navigator.vendor)); }catch(e){}
try{ L.push(line('hwConc', navigator.hardwareConcurrency)); }catch(e){}
try{ L.push(line('lang', navigator.languages.join(','))); }catch(e){}
try{ L.push(line('crossOrgIso', String(self.crossOriginIsolated))); }catch(e){}
try{ L.push(line('SharedArrBuf', typeof SharedArrayBuffer)); }catch(e){}
try{ L.push(line('WebAssembly', typeof WebAssembly)); }catch(e){}
try{
  // tiny valid wasm module: (module) -> confirms wasm compile works
  var w=new Uint8Array([0,97,115,109,1,0,0,0]);
  L.push(line('wasmCompile', WebAssembly.validate(w)?'OK':'FAIL'));
}catch(e){L.push('wasm err '+e);}
try{ L.push(line('href', location.href)); }catch(e){}
try{ L.push(line('referrer', document.referrer)); }catch(e){}
try{ L.push(line('date', new Date().toString())); }catch(e){}
try{ L.push(line('tz', Intl.DateTimeFormat().resolvedOptions().timeZone)); }catch(e){}
document.getElementById('out').textContent = L.join('\n');
</script>
</body></html>
