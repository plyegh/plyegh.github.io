name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: [README.md, LICENSE, .gitignore]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install poppler (PDF page images)
        # retried: the runner's apt mirrors sometimes fail DNS for a minute or two
        run: |
          command -v pdftoppm && exit 0
          for i in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=3 && \
              sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils && exit 0
            echo "apt attempt $i failed, retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
