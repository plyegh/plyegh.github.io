# Weekly pull requests for outdated or vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Pinned to 5.5.207: 5.6–6.2 carry GHSA-hq66-cqwq-w95j, and 6.x crashes with @napi-rs/canvas
      # in scripts/render-docs.mjs. Re-test PDF rendering before lifting this.
      - dependency-name: pdfjs-dist
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
